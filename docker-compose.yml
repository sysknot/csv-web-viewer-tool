services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - csv_data:/var/www/storage
    healthcheck:
      test: ["CMD", "php", "-r", "$$p=getenv('DB_PATH') ?: '/var/www/storage/database/app.sqlite'; new PDO('sqlite:'.$$p); echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  csv_data:
